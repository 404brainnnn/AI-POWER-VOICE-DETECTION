[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-clone-detector"
version = "0.1.0"
description = "Privacy-preserving DSP baseline and research platform for voice-cloning impersonation detection"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "soundfile>=0.12,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
audio = ["librosa>=0.10,<1"]
ml = ["torch>=2.5,<3", "torchaudio>=2.5,<3", "transformers>=4.47,<5", "PyYAML>=6,<7"]
mlops = ["mlflow>=2.10,<3", "zenml>=0.60,<1"]
onnx = ["onnxruntime>=1.17,<2"]
infra = ["redis>=5,<6", "pymongo>=4.6,<5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1", "ruff>=0.4,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*", "audio*", "dsp*", "models*", "fusion*", "datasets*", "evaluation*", "monitoring*", "notifications*", "storage*", "pipelines*"]
