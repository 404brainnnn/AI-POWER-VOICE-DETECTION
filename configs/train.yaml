data:
  csv_path: data/manifest.csv
  sample_rate: 16000
  duration_seconds: 3.0
  batch_size: 4
  num_workers: 2
train:
  seed: 42
  model: baseline_cnn
  backbone: lcnn
  epochs: 20
  learning_rate: 0.0002
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.0002
  weight_decay: 0.0001
  warmup_steps: 100
  gradient_accumulation_steps: 1
  grad_clip_norm: 1.0
  amp: bf16
  loss: weighted_cross_entropy
  early_stopping_patience: 5
  checkpoint_dir: artifacts/checkpoints
  output_dir: artifacts/run
